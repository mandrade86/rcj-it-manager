# RCJ IT Manager — Pipeline DESARROLLO (solo)
#
# Trigger: push a main → Build + Deploy Dev automático
# Producción: pipeline aparte → azure-pipelines-prod.yml
#
# Setup: deploy/AZURE-PIPELINES.md

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'
      - 'deploy/teams-pmo-personal/**'
      - 'docs/**'
      - 'azure-pipelines-prod.yml'

pr: none

variables:
  nodeVersion: '22.x'
  agentPoolDev: 'Default'
  deployRootDev: 'P:\rcj-it-manager'
  serviceNameDev: 'RCJITManager'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Verify
        displayName: Install + build (verificación)
        pool:
          name: $(agentPoolDev)
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: Node.js

          - powershell: |
              npm install --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              npm install --prefix client --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              npm run build
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: npm install + build client

          - powershell: |
              npm test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: Unit tests (Vitest)

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/test-results/junit.xml'
              testRunTitle: 'RCJ IT Manager — unit'
              failTaskOnFailedTests: true
              mergeTestResults: true

  - stage: DeployDev
    displayName: Deploy desarrollo
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDevJob
        displayName: Deploy a desarrollo
        environment: development
        pool:
          name: $(agentPoolDev)
        timeoutInMinutes: 90
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  clean: false
                  persistCredentials: true

                - task: PowerShell@2
                  displayName: Deploy Dev (git + build + restart)
                  inputs:
                    targetType: filePath
                    filePath: '$(Build.SourcesDirectory)/scripts/deploy-from-pipeline.ps1'
                    arguments: '-Env Dev'
                    pwsh: false
                    workingDirectory: '$(Build.SourcesDirectory)'
                  timeoutInMinutes: 75
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                    RCJ_GIT_REMOTE: 'https://dev.azure.com/RCJCorporation/RCJ-IT-MANAGER/_git/RCJ-IT-MANAGER'
                    RCJ_DEPLOY_ROOT: $(deployRootDev)
                    RCJ_SERVICE_NAME: $(serviceNameDev)
                    RCJ_GIT_BRANCH: 'main'
                    RCJ_HEALTH_PORT: '3002'
