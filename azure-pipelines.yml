# RCJ IT Manager — Azure Pipelines
#
# Dev:  automático en cada push a main
# Prod: solo tras aprobación en el environment "production"
#
# Setup: ver deploy/AZURE-PIPELINES.md
#
# Pool: usa "Default" (agente self-hosted Windows). Si creas pools propios,
# cambia agentPoolDev / agentPoolProd abajo o en Variables del pipeline.

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '**/*.md'
      - 'deploy/teams-pmo-personal/**'
      - 'docs/**'

pr: none

variables:
  nodeVersion: '22.x'
  # Nombre exacto del Agent pool en Project settings → Agent pools
  agentPoolDev: 'Default'
  agentPoolProd: 'Default'

stages:
  # ── Build (mismo agente self-hosted; evita paralelismo Microsoft hosted) ───
  - stage: Build
    displayName: Build
    jobs:
      - job: Verify
        displayName: Install + build (verificación)
        pool:
          name: $(agentPoolDev)
        steps:
          - checkout: self
            fetchDepth: 1

          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: Node.js

          - powershell: |
              npm install --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              npm install --prefix client --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              npm run build
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: npm install + build client

  # ── Desarrollo (automático) ────────────────────────────────────────────────
  - stage: DeployDev
    displayName: Deploy desarrollo
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDevJob
        displayName: Deploy a desarrollo
        environment: development
        pool:
          name: $(agentPoolDev)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  clean: false

                - task: PowerShell@2
                  displayName: Deploy Dev (git + build + restart)
                  inputs:
                    targetType: filePath
                    filePath: '$(Build.SourcesDirectory)/scripts/deploy-from-pipeline.ps1'
                    arguments: '-Env Dev'
                    pwsh: false
                    workingDirectory: '$(Build.SourcesDirectory)'
                  env:
                    RCJ_DEPLOY_ROOT: 'D:\rcj-it-manager'
                    RCJ_SERVICE_NAME: 'RCJITManager'
                    RCJ_GIT_BRANCH: 'main'

  # ── Producción (requiere aprobación del environment "production") ──────────
  - stage: DeployProd
    displayName: Deploy producción
    dependsOn: DeployDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProdJob
        displayName: Deploy a producción
        # Environments → production → Approvals and checks → Approvals
        environment: production
        pool:
          name: $(agentPoolProd)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  fetchDepth: 1
                  clean: false

                - task: PowerShell@2
                  displayName: Deploy Prod (git + build + restart)
                  inputs:
                    targetType: filePath
                    filePath: '$(Build.SourcesDirectory)/scripts/deploy-from-pipeline.ps1'
                    arguments: '-Env Prod'
                    pwsh: false
                    workingDirectory: '$(Build.SourcesDirectory)'
                  env:
                    RCJ_DEPLOY_ROOT: 'D:\rcj-it-manager'
                    RCJ_SERVICE_NAME: 'RCJITManager'
                    RCJ_GIT_BRANCH: 'main'
