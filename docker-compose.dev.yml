# Desarrollo / staging — URL sugerida: http://portal-dev.rcjcorporacion.com o http://IP:3002
# Uso: docker compose -f docker-compose.dev.yml --env-file .env.development up -d --build

name: rcj-it-manager-dev

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '${MONGO_HOST_PORT:-27018}:27017'
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3002}:3001'
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/rcj_it_manager_dev
      MONGODB_CONNECT_RETRIES: 30
      MONGODB_CONNECT_DELAY_MS: 2000
      AUTH_AD_ENABLED: 'false'
      AUTH_LOCAL_FALLBACK: 'false'
      AD_DOMAIN: ${AD_DOMAIN:-RCJ}
      AD_EMAIL_DOMAINS: ${AD_EMAIL_DOMAINS:-rcjcorp.com,grupoc.com}
      EHR_LOGIN_URL: ${EHR_LOGIN_URL:-https://ehrapi.rcjcorp.hn/api/Login}
      SAP_BI_DRIVER: ${SAP_BI_DRIVER:-hana}
      SAP_BI_HOST: ${SAP_BI_HOST:-172.16.146.16}
      SAP_BI_PORT: ${SAP_BI_PORT:-30015}
      SAP_BI_DATABASE: ${SAP_BI_DATABASE:-RCJ_BI}
      SAP_BI_SCHEMA: ${SAP_BI_SCHEMA:-RCJ_BI}
      SAP_BI_VIEW: ${SAP_BI_VIEW:-VW_BI_VENTA_COSTO}
      SAP_BI_USERNAME: ${SAP_BI_USERNAME:-B2User}
      SAP_BI_PASSWORD: ${SAP_BI_PASSWORD:-}
      SAP_BI_ENCRYPT: ${SAP_BI_ENCRYPT:-true}
      SAP_BI_TRUST_CERT: ${SAP_BI_TRUST_CERT:-true}
    volumes:
      - ./data:/app/data
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data_dev:
