# Producción — URL: https://portal.rcjcorp.hn (Nginx en el host → app:3001)
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

name: rcj-it-manager-prod

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    # Solo localhost: Nginx publica portal.rcjcorp.hn hacia este puerto
    ports:
      - '127.0.0.1:${APP_PORT:-3001}:3001'
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/rcj_it_manager
      MONGODB_CONNECT_RETRIES: 30
      MONGODB_CONNECT_DELAY_MS: 2000
    volumes:
      - ./data:/app/data
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data_prod:
